AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to create an S3 bucket, a DynamoDB table, and an SNS topic.

Resources:

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ipgsopra90code

  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ipgsopraUserTable990
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: MyipgsopraSNSTopic

Outputs:

  S3BucketName:
    Description: Name of the S3 bucket
    Value: !Ref S3Bucket
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketName"

  DynamoDBTableName:
    Description: Name of the DynamoDB table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDBTableName"

  SNSTopicARN:
    Description: ARN of the SNS topic
    Value: !Ref SNSTopic
    Export:
      Name: !Sub "${AWS::StackName}-SNSTopicARN"