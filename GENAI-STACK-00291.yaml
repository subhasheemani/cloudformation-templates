AWSTemplateFormatVersion: '2010-09-09'
Description: Create a Lambda function named testLambda87 with runtime Python 3.12 and basic execution role.

Resources:

  testLambda87Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  testLambda87:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          def lambda_handler(event, context):
            print("Hello from testLambda87!")
            return {
              'statusCode': 200,
              'body': 'Lambda function executed successfully!'
            }
      Handler: index.lambda_handler
      MemorySize: 128
      Role: !GetAtt testLambda87Role.Arn
      Runtime: python3.12
      Timeout: 30