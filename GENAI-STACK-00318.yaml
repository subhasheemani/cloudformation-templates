AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Bucket and SNS Integration

Resources:

  s3inchrome0505:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: s3inchrome0505
      NotificationConfiguration:
        TopicConfigurations:
        - Event: s3:ObjectCreated:*
          Topic: !Ref snsinchrome0505

  snsinchrome0505:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: snsinchrome0505

  snsinchrome0505Policy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: s3.amazonaws.com
          Action: sns:Publish
          Resource: !Ref snsinchrome0505
      Topics:
      - !Ref snsinchrome0505