AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to add permissions to existing Lambda function

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  StepFunctionInvokePermission:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: StepFunctionInvokeAccess
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "states:StartExecution"
            Resource: "arn:aws:states:eu-central-1:616613568484:stateMachine:stepfunctioninchrome"
      Roles:
        - !Ref LambdaExecutionRole