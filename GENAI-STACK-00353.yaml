AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Bucket with Static Website

Resources:

  ukduBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ukdu
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      
  ukduBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ukduBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Join 
              - ''
              - - 'arn:aws:s3:::' 
                - !Ref ukduBucket
                - '/*'