AWSTemplateFormatVersion: '2010-09-09'
Description: SNS Event Template

Resources:

  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: snsevent2

  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            AWS: '*'
          Action: sns:Publish
          Resource: !Ref SNSTopic
      Topics:
      - !Ref SNSTopic