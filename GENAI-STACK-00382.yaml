AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template for reg-test lambda and step function

Resources:

  regTestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: 'sts:AssumeRole'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  regTestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: reg-test
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt regTestLambdaRole.Arn
      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': json.dumps('Hello from Lambda!')
              }

  regTestStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: reg-test-state-machine
      DefinitionString:
        !Sub
          - |-
            {
              "StartAt": "regTestLambda",
              "States": {
                "regTestLambda": {
                  "Type": "Task",
                  "Resource": "${regTestLambda.Arn}",
                  "End": true
                }
              }
            }
          - { regTestLambda: !Ref regTestLambda }
      RoleArn: !GetAtt regTestStateMachineRole.Arn

  regTestStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: 'sts:AssumeRole'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaRole