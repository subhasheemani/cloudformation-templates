version: 0.2

phases:
  install:
    commands:
      - npm install -g aws-cdk
      - python -m pip install --upgrade pip
      - pip install aws-cdk-lib constructs

  pre_build:
    commands:
      - echo Preparing generated CDK app
      - rm -rf cdk-app
      - mkdir cdk-app
      - printf "%s" "$TEMPLATE_BODY" > cdk-app/app.py
      - printf "aws-cdk-lib\nconstructs\n" > cdk-app/requirements.txt
      - 'printf "{\n  \"app\": \"python app.py\"\n}\n" > cdk-app/cdk.json

  build:
    commands:
      - cd cdk-app
      - pip install -r requirements.txt

      # get account id inside CodeBuild
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      # bootstrap explicitly
      - cdk bootstrap aws://616613568484/eu-central-1

      # deploy
      - cdk deploy --require-approval never
