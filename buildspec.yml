version: 0.2
 
phases:
  install:
    commands:
      - npm install -g aws-cdk
      - python -m pip install --upgrade pip
      - pip install aws-cdk-lib constructs
 
  pre_build:
    commands:
      - echo "Creating CDK app folder"
      - mkdir -p cdk-app
      - cd cdk-app
 
      - echo "Writing generated CDK code to app.py"
      - echo "$TEMPLATE_BODY" > app.py
 
      - echo "Creating minimal requirements.txt"
      - |
        cat > requirements.txt <<EOF
aws-cdk-lib
constructs
EOF
 
      - echo "Creating cdk.json"
      - |
        cat > cdk.json <<EOF
{
  "app": "python app.py"
}
EOF
 
  build:
    commands:
      - cd cdk-app
      - cdk bootstrap
      - cdk deploy --require-approval never
