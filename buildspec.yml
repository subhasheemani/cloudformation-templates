version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install -g aws-cdk

  pre_build:
    commands:
      - echo "Preparing CDK TypeScript app"
      - rm -rf cdk-app
      - mkdir -p cdk-app/lib

      # Write generated code
      - printf "%s" "$TEMPLATE_BODY" > cdk-app/lib/app.ts

      # Create package.json
      - |
        printf '{
          "name": "cdk-app",
          "version": "1.0.0",
          "bin": {
            "cdk-app": "bin/cdk-app.js"
          }
        }' > cdk-app/package.json

      # Create tsconfig
      - |
        printf '{
          "compilerOptions": {
            "target": "ES2020",
            "module": "commonjs",
            "strict": true
          }
        }' > cdk-app/tsconfig.json

      # Install dependencies
      - cd cdk-app
      - npm install aws-cdk-lib constructs typescript ts-node

      # Create entry file
      - mkdir -p bin
      - |
        printf "import '../lib/app';" > bin/cdk-app.ts

  build:
    commands:
      - npx cdk bootstrap
      - npx cdk deploy $STACK_NAME --require-approval never
