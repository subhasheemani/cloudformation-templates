version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install -g aws-cdk
      - python -m pip install --upgrade pip
      - pip install aws-cdk-lib constructs

  pre_build:
    commands:
      - echo Preparing generated CDK app...
      - rm -rf cdk-app
      - mkdir cdk-app

      # Write generated CDK code
      - printf "%s" "$TEMPLATE_BODY" > cdk-app/app.py

      # Requirements
      - printf "aws-cdk-lib\nconstructs\n" > cdk-app/requirements.txt

      # CDK config
      - |
        printf '{
          "app": "python app.py"
        }' > cdk-app/cdk.json

  build:
    commands:
      - echo Starting CDK deployment...
      - cd cdk-app

      - pip install -r requirements.txt

      # Debug logs
      - echo "STACK_NAME=$STACK_NAME"
      - echo "Deploying stack..."

      # Deploy (NO bootstrap here)
      - cdk deploy $STACK_NAME --require-approval never
