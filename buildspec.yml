version: 0.2

phases:
  install:
    commands:
      - npm install -g aws-cdk
      - python -m pip install --upgrade pip
      - pip install aws-cdk-lib constructs

  pre_build:
    commands:
      - echo Preparing generated CDK app
      - rm -rf cdk-app
      - mkdir cdk-app
      - cd cdk-app
      - printf "%s" "$TEMPLATE_BODY" > app.py
      - printf "aws-cdk-lib\nconstructs\n" > requirements.txt
      - printf "{\n  \"app\": \"python app.py\"\n}\n" > cdk.json

  build:
    commands:
      - cd cdk-app
      - cdk bootstrap
      - cdk deploy --require-approval never
